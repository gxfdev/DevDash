global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'devdash'

scrape_configs:
  # DevDash应用自身指标
  - job_name: 'devdash'
    static_configs:
      - targets: ['devdash:9090']
        labels:
          group: 'devdash'
    metrics_path: '/api/metrics'
    scrape_interval: 10s

  # 主机节点指标
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          group: 'infrastructure'
    scrape_interval: 10s

  # 容器资源指标
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          group: 'containers'
    scrape_interval: 10s

# 告警规则配置
rule_files:
  - /etc/prometheus/alert-rules.yml

# Alertmanager配置（可选，未启用时告警仅显示在Prometheus UI）
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # 如需启用Alertmanager，取消注释并配置：
          # - targets: ['alertmanager:9093']
