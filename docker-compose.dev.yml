services:
  devdash:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: devdash-dev
    ports:
      - "9090:9090"
    volumes:
      - devdash-data:/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /dev:/host/dev:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - PORT=9090
      - INTERVAL=5
      - DB_PATH=/data/devdash.db
      - JWT_SECRET=devdash-dev-secret-key-min-32ch!!
      - STATIC_DIR=/srv/www
      - TZ=Asia/Shanghai
      - GIN_MODE=debug
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_DEV=/host/dev
      - HOST_ETC=/host/etc
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - devdash-net

  nginx:
    image: nginx:alpine
    container_name: devdash-nginx-dev
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      devdash:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - devdash-net

networks:
  devdash-net:
    driver: bridge

volumes:
  devdash-data:
    driver: local
