name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-server:
    name: Server Tests
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum
      - name: Build check
        run: cd server && go build ./...
      - name: Vet
        run: cd server && go vet ./...
      - name: Start server for integration tests
        run: |
          cd server
          ENCRYPTION_KEY=test-encryption-key-32bytes!! JWT_SECRET=test-jwt-secret-key-32byt go run ./cmd/server &
          sleep 5
      - name: Run integration tests
        run: cd server && go test ./tests/... -v -timeout 60s
      - name: Stop server
        if: always()
        run: pkill -f "go run ./cmd/server" || true

  build-web:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install & Build
        run: cd web && npm ci && npm run build
      - name: Type check
        run: cd web && npx vue-tsc --noEmit

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [test-server, build-web]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f docker/Dockerfile.server -t devdash:test .
