global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'devdash'

scrape_configs:
  - job_name: 'devdash'
    static_configs:
      - targets: ['devdash:9090']
        labels:
          group: 'devdash'
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          group: 'infrastructure'
    scrape_interval: 10s

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          group: 'containers'
    scrape_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []
