name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  build-and-push-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-binaries:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: server/go.sum
      - name: Build
        working-directory: server
        run: |
          mkdir -p ${{ github.workspace }}/dist
          CGO_ENABLED=1 go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -trimpath -o ${{ github.workspace }}/dist/webshell-linux-amd64 ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: dist/webshell-linux-amd64

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Archive
        run: |
          mkdir -p ${{ github.workspace }}/dist
          tar -czf ${{ github.workspace }}/dist/frontend-dist.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/frontend-dist.tar.gz

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-push-image, build-binaries, build-frontend]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/webshell-linux-amd64
            dist/frontend-dist.tar.gz
          generate_release_notes: true
          body: |
            ## Docker Image
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            ## Quick Start
            ```bash
            # Docker Compose (recommended)
            curl -O https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.ghcr.yml
            export JWT_SECRET=$(openssl rand -hex 32)
            docker compose -f docker-compose.ghcr.yml up -d
            ```

            ## Binary
            ```bash
            chmod +x webshell-linux-amd64
            JWT_SECRET=$(openssl rand -hex 32) ./webshell-linux-amd64
            ```

            Default login: `admin` / `admin123` (change immediately after first login)
