services:
  devdash:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: devdash
    expose:
      - "9090"
    volumes:
      - devdash-data:/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /dev:/host/dev:ro
      - /etc/hostname:/etc/hostname:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - PORT=9090
      - INTERVAL=5
      - DB_PATH=/data/devdash.db
      - "JWT_SECRET=${JWT_SECRET:?ERROR: JWT_SECRET required. Generate with: openssl rand -hex 32}"
      - AGENT_TOKEN=${AGENT_TOKEN:-}
      - STATIC_DIR=/srv/www
      - TZ=Asia/Shanghai
      - LANG=C.UTF-8
      - GIN_MODE=${GIN_MODE:-release}
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:9090
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_DEV=/host/dev
      - HOST_ETC=/host/etc
    restart: unless-stopped
    restart_delay: 5s
    mem_limit: 512m
    cpus: "2.0"
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SYS_PTRACE
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - devdash-net

  nginx:
    image: nginx:alpine
    container_name: devdash-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      devdash:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    cpus: "1.0"
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=32m,mode=1777
      - /var/run:size=8m,mode=1733
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - devdash-net

  postgres:
    image: postgres:16-alpine
    container_name: devdash-postgres
    environment:
      POSTGRES_DB: devdash
      POSTGRES_USER: devdash
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devdash_secure_2024}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    mem_limit: 256m
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devdash"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - postgres
    networks:
      - devdash-net

networks:
  devdash-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16

volumes:
  devdash-data:
    driver: local
  postgres-data:
    driver: local
  nginx-logs:
    driver: local
