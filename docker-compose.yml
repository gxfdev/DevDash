# AIDash · 单机 AI 操作系统（Docker 版）
#
# 默认以「运维模式」运行：容器保持隔离，但拥有管理宿主机 Docker、
# 读取宿主机文件与系统的能力，以便在面板内一键部署 AI 并管理其容器。
services:
  aidash:
    build:
      context: .
      dockerfile: Dockerfile
    image: aidash:latest
    container_name: aidash
    restart: unless-stopped
    # 运维模式：面板自身需要 root 级能力来管理容器与宿主机
    privileged: true
    pid: host
    ports:
      - "${AIDASH_PORT:-9090}:9090"
    volumes:
      - aidash-data:/data
      - aidash-models:/models
      # 管理宿主机 Docker（部署 / 启停 / 日志 / exec）
      - /var/run/docker.sock:/var/run/docker.sock
      # 宿主机根目录（运维助手 / 宿主机权限容器）
      - /:/host:rw
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /dev:/host/dev:ro
    environment:
      - PORT=9090
      - TZ=${TZ:-Asia/Shanghai}
      - GIN_MODE=release
      - JWT_SECRET=${JWT_SECRET:?请在 .env 中设置 JWT_SECRET（openssl rand -hex 32）}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-admin123}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - HOST_ROOT=/host
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_DEV=/host/dev
      - AIDASH_TARGET_OS=linux
      - AIDASH_HOST_NS=1
      # 国内服务器可启用 ghcr 镜像加速（也可先在宿主机 docker pull 再部署）
      # - AIDASH_IMAGE_MIRROR=ghcr.m.daocloud.io
      # 模型下载走清华 PyPI 源
      - PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    security_opt:
      - seccomp:unconfined
      - apparmor=unconfined

volumes:
  aidash-data:
  aidash-models:
