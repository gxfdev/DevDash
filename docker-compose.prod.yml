version: '3.8'

services:
  # DevDash 主服务
  devdash:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: devdash-app
    restart: unless-stopped
    environment:
      - PORT=9090
      - JWT_SECRET=${JWT_SECRET:-$(openssl rand -hex 32)}
      - TZ=Asia/Shanghai
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - GIN_MODE=release
      - CORS_ORIGINS=https://your-domain.com
    volumes:
      - devdash-data:/data
    networks:
      - internal-net
    expose:
      - "9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Nginx 反向代理 (HTTPS)
  nginx:
    image: nginx:alpine
    container_name: devdash-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      devdash:
        condition: service_healthy  # 等待devdash健康检查通过
    networks:
      - internal-net

networks:
  internal-net:
    driver: bridge

volumes:
  devdash-data:
  nginx-logs:
