name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-server:
    name: Server Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: server/go.sum
      - name: Test
        run: cd server && go test ./... -v -race -timeout 60s

  build-web:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install & Build
        run: cd web && npm ci && npm run build

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [test-server, build-web]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f docker/Dockerfile.server -t devdash:test .

  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Vet
        run: cd server && go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Type check
        run: cd web && npm ci && npx vue-tsc --noEmit