services:
  devdash:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: devdash
    ports:
      - "9090:9090"
    volumes:
      - devdash-data:/data
    environment:
      - PORT=9090
      - INTERVAL=30
      - DB_PATH=/data/devdash.db
      - "JWT_SECRET=${JWT_SECRET:?ERROR: JWT_SECRET required. Generate with: openssl rand -hex 32}"
      - AGENT_TOKEN=${AGENT_TOKEN:-}
      - STATIC_DIR=/srv/www
      - TZ=Asia/Shanghai
      - LANG=zh_CN.UTF-8
      - LC_ALL=zh_CN.UTF-8
      - GIN_MODE=${GIN_MODE:-debug}
      - CORS_ORIGINS=http://localhost:9090,http://127.0.0.1:9090
    restart: unless-stopped
    restart_delay: 5s
    mem_limit: 512m
    cpus: "2.0"
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "http://localhost:9090/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: devdash-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16

volumes:
  devdash-data:
    driver: local
