version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: devdash-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - devdash-web:/var/www/devdash:ro
      - certs:/etc/certs:ro
    depends_on:
      - devdash
    restart: unless-stopped

  devdash:
    image: ghcr.io/${GITHUB_USER:-owner}/devdash:latest
    container_name: devdash
    environment:
      - PORT=9090
      - INTERVAL=30
      - DB_PATH=/data/devdash.db
      - JWT_SECRET=${JWT_SECRET:?Please set JWT_SECRET in .env}
      - STATIC_DIR=/srv/www
      - TZ=Asia/Shanghai
      - GIN_MODE=release
      - CORS_ORIGINS=${DOMAIN:-https://your-domain.com}
    volumes:
      - devdash-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  default:
    name: devdash-prod-net

volumes:
  devdash-data:
    name: devdash-prod-data
  devdash-web:
    name: devdash-prod-web
  certs:
    name: devdash-certs