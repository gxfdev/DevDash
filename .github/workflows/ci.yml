name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-server:
    name: Server Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum
      - name: Debug info
        run: |
          echo "=== PWD ==="
          pwd
          echo "=== Go version ==="
          go version
          echo "=== Go env ==="
          go env GOMOD GOWORK GOROOT
          echo "=== go.mod ==="
          head -5 go.mod
          echo "=== Directory structure ==="
          ls -la internal/ | head -20
          echo "=== internal/agent ==="
          ls -la internal/agent/ 2>&1 || echo "MISSING"
      - name: Build check
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Start server for integration tests
        run: |
          ENCRYPTION_KEY=test-encryption-key-32bytes!! JWT_SECRET=test-jwt-secret-key-32bytes-min!! go run ./cmd/server &
          sleep 5
      - name: Run integration tests
        run: go test ./tests/... -v -timeout 60s
      - name: Stop server
        if: always()
        run: pkill -f "go run ./cmd/server" || true

  build-web:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install & Build
        run: npm ci && npm run build
      - name: Type check
        run: npx vue-tsc --noEmit

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [test-server, build-web]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f docker/Dockerfile.server -t devdash:test .
