name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-server:
    name: Server Lint & Vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Go fmt check
        run: |
          output=$(gofmt -l .)
          if [ -n "$output" ]; then
            echo "::error::Files not formatted:"
            echo "$output"
            exit 1
          fi
      - name: Go vet
        run: go vet ./...

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum
      - name: Go mod verify
        run: go mod verify
      - name: Run govulncheck
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  test-server:
    name: Server Tests
    runs-on: ubuntu-latest
    needs: [lint-server]
    defaults:
      run:
        working-directory: server
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Build check
        run: go build ./...
      - name: Run unit tests
        run: go test ./internal/... -v -race -timeout 120s -coverprofile=coverage.out
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: server/coverage.out

  test-server-windows:
    name: Server Tests (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: server
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Build check
        run: go build ./...
      - name: Run unit tests
        run: go test ./internal/... -v -timeout 120s

  build-web:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx vue-tsc --noEmit
      - name: Build
        run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [test-server, build-web]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f docker/Dockerfile.server -t devdash:test .
      - name: Test Docker image
        run: |
          docker run -d --name devdash-test \
            -e JWT_SECRET=test-jwt-secret-key-32bytes-min!! \
            -e ENCRYPTION_KEY=test-encryption-key-32bytes!! \
            -p 9091:9090 \
            devdash:test
          sleep 5
          curl -sf http://localhost:9091/api/v1/health || { docker logs devdash-test; exit 1; }
          docker stop devdash-test

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint-server, security-scan, test-server, test-server-windows, build-web, docker-build]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "lint-server: ${{ needs.lint-server.result }}"
          echo "security-scan: ${{ needs.security-scan.result }}"
          echo "test-server: ${{ needs.test-server.result }}"
          echo "test-server-windows: ${{ needs.test-server-windows.result }}"
          echo "build-web: ${{ needs.build-web.result }}"
          echo "docker-build: ${{ needs.docker-build.result }}"
          if [ "${{ needs.lint-server.result }}" != "success" ] || \
             [ "${{ needs.security-scan.result }}" == "failure" ] || \
             [ "${{ needs.test-server.result }}" != "success" ] || \
             [ "${{ needs.test-server-windows.result }}" != "success" ] || \
             [ "${{ needs.build-web.result }}" != "success" ] || \
             [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo "::error::CI pipeline failed"
            exit 1
          fi
          echo "All CI checks passed!"
